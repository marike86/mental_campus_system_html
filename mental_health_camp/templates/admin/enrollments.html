{% extends 'base.html' %}{% block content %}<h1 class="text-2xl mb-4">待批准报名</h1>{% set bulk_action='approve' %}{% set bulk_label='批量批准' %}{% include 'admin/bulk_controls.html' %}
{% for e in records %}<article class="bg-white p-4 mb-2"><label><input type="checkbox" class="bulk-item" value="{{e.id}}"> 报名 {{e.id}} · 学员 {{e.user_id}} · 训练营 {{e.bootcamp_id}} · 批次 {{e.batch_id or '未分批'}}</label></article>{% else %}<p>没有待批准报名</p>{% endfor %}
<nav class="flex gap-4">{% if page>1 %}<a href="?page={{page-1}}">上一页</a>{% endif %}{% if page*20<total %}<a href="?page={{page+1}}">下一页</a>{% endif %}</nav>{% endblock %}
